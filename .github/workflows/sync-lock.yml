name: Sync lockfile once

on:
  push:
    branches:
      - feat/20260812-dependency-calver

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/20260812-dependency-calver
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate and verify lockfile delta
        shell: bash
        run: |
          set -euo pipefail
          cargo check
          test "$(git status --short)" = " M Cargo.lock"
          test "$(git diff --numstat -- Cargo.lock)" = $'0\t1\tCargo.lock'
          git diff --unified=0 -- Cargo.lock | grep -q '^-[[:space:]]*"hmac",$'
      - name: Commit generated lockfile and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sync-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock .github/workflows/sync-lock.yml
          git commit -m "chore: sync Cargo.lock"
          git push origin HEAD:feat/20260812-dependency-calver
