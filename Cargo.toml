[package]
name = "agent-limits"
version = "2026.7.3"
edition = "2021"
rust-version = "1.85"
description = "Monitor Claude, Codex, and OpenCode Go usage limits from the terminal"
license = "MIT"
repository = "https://github.com/f4ah6o/agent-limits"
homepage = "https://github.com/f4ah6o/agent-limits"
readme = "README.md"
keywords = ["cli", "claude", "codex", "opencode", "usage"]
categories = ["command-line-utilities"]
include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

[[bin]]
name = "agent-limits"
path = "src/main.rs"

[dependencies]
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
regex = "1"
rusqlite = "0.31"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
pbkdf2 = "0.12"
sha1 = "0.10"
hmac = "0.12"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[workspace.metadata.dist]
dist-version = "0.32.0"
ci = "github"
installers = ["shell"]
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
cargo-dist-version = "0.32.0"
install-path = "CARGO_HOME"
install-updater = false

[profile.dist]
inherits = "release"
lto = "thin"
